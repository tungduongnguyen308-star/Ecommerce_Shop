name: smartshop-tx1

services:
  mysql:
    image: mysql:8.4
    container_name: smartshop-mysql
    environment:
      MYSQL_DATABASE: smartshop_tx1
      MYSQL_USER: smartshop
      MYSQL_PASSWORD: smartshop123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/tx1_smartshop.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: smartshop-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartshop-ecommerce:latest
    container_name: smartshop-app
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      PORT: 8080
      MYSQL_URL: jdbc:mysql://mysql:3306/smartshop_tx1?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=SERVER
      MYSQL_USER: smartshop
      MYSQL_PASSWORD: smartshop123
      QDRANT_URL: http://qdrant:6333
      DEMO_ADMIN_EMAIL: admin@smartshop.local
      DEMO_ADMIN_PASSWORD: Admin@123
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
