<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng ký tài khoản')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container section-pad"><div class="auth-box"><div class="text-center mb-4"><h1>Tạo tài khoản khách hàng</h1><p>Điền thông tin để đăng ký và mua sắm.</p></div><form th:action="@{/register}" th:object="${form}" method="post" novalidate>
<div class="mb-3"><label class="form-label">Họ và tên</label><input class="form-control" th:field="*{fullName}" required maxlength="150"><div class="field-error" th:errors="*{fullName}"></div></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}" required><div class="field-error" th:errors="*{email}"></div></div>
<div class="mb-3"><label class="form-label">Số điện thoại</label><input class="form-control" th:field="*{phone}" required><div class="field-error" th:errors="*{phone}"></div></div>
<div class="mb-3"><label class="form-label">Địa chỉ</label><textarea class="form-control" th:field="*{address}" rows="2" required></textarea><div class="field-error" th:errors="*{address}"></div></div>
<div class="mb-3"><label class="form-label">Mật khẩu (ít nhất 8 ký tự)</label><input class="form-control" type="password" th:field="*{password}" required minlength="8"><div class="field-error" th:errors="*{password}"></div></div>
<div class="mb-4"><label class="form-label">Xác nhận mật khẩu</label><input class="form-control" type="password" th:field="*{confirmPassword}" required><div class="field-error" th:errors="*{confirmPassword}"></div></div>
<button class="btn btn-primary btn-lg w-100" type="submit">Đăng ký</button></form><p class="text-center mt-3 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
