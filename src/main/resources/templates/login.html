<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Đăng nhập quản trị')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container section-pad"><div class="auth-box"><div class="text-center mb-4"><h1>Đăng nhập quản trị</h1></div><div class="alert alert-danger" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div><div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
<form method="post" th:action="@{/login}"><div class="mb-3"><label class="form-label">Email</label><input name="username" type="email" class="form-control" required autofocus></div><div class="mb-4"><label class="form-label">Mật khẩu</label><input name="password" type="password" class="form-control" required></div><button class="btn btn-primary btn-lg w-100">Đăng nhập</button></form></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
