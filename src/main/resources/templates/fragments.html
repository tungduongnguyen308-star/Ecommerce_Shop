<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle}+' • Ecommerce Shop'">Ecommerce Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/smartshop.css}">
    <link rel="stylesheet" th:href="@{/css/header-cta.css}">
    <link rel="stylesheet" th:href="@{/css/cart-live.css}">
</head>
<body>
<!-- Header thống nhất, giữ nguyên màu navy Ecommerce Shop -->
<header th:fragment="nav" class="shop-header">
    <nav class="navbar navbar-dark nav-smart shop-unified-header" aria-label="Điều hướng Ecommerce Shop">
        <div class="container shop-nav-layout">
            <a class="navbar-brand fw-bold shop-brand" th:href="@{/}" href="/"
               aria-label="Ecommerce Shop - về trang chủ">
                <span class="brand-mark" aria-hidden="true">◈</span>
                Ecommerce<span class="brand-accent"> Shop</span>
            </a>
            <div class="dropdown shop-category-dropdown">
                <button class="shop-category-trigger dropdown-toggle" type="button" data-bs-toggle="dropdown"
                        aria-expanded="false" aria-label="Chọn danh mục sản phẩm">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M3 6h18M3 12h18M3 18h18"/>
                    </svg>
                    <span th:text="${selectedCategoryName != null ? selectedCategoryName : 'Danh mục'}">Danh mục</span>
                </button>
                <ul class="dropdown-menu shop-category-menu">
                    <li><h6 class="dropdown-header">DANH MỤC SẢN PHẨM</h6></li>
                    <li><a class="dropdown-item" th:href="@{/products}" href="/products">Tất cả sản phẩm</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li th:each="c : ${headerCategories}">
                        <a class="dropdown-item" th:href="@{/products(categoryId=${c.id})}"
                           th:text="${c.name}">Tên danh mục</a>
                    </li>
                </ul>
            </div>
            <form class="shop-global-search" role="search" method="get" th:action="@{/products}" action="/products">
                <label for="header-search-keyword" class="visually-hidden">Tìm kiếm sản phẩm</label>
                <input id="header-search-keyword" name="keyword" type="search" autocomplete="off"
                       placeholder="Nhập tên điện thoại, laptop, phụ kiện... cần tìm"
                       th:value="${keyword}"/>
                <input th:if="${categoryId != null}" type="hidden" name="categoryId" th:value="${categoryId}"/>
                <input type="hidden" name="searchMode" value="mysql"/>
                <button type="submit" class="shop-search-submit" aria-label="Tìm sản phẩm">
                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.8"/>
                        <path d="m16 16 5 5"/>
                    </svg>
                </button>
            </form>
            <div class="shop-user-actions">
                <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm" th:href="@{/register}">Đăng ký</a>
                <span sec:authorize="isAuthenticated()" class="text-white small"
                      th:text="${#authentication.name}"></span>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                    <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
                </form>
                <a class="btn btn-cart shop-cart-link" th:href="@{/cart}" href="/cart" aria-label="Giỏ hàng">
                    <span aria-hidden="true">🛒</span><span class="shop-action-text">Giỏ hàng</span>
                </a>
                <a sec:authorize="hasRole('ADMIN')" class="btn btn-outline-light btn-sm shop-admin-link"
                   th:href="@{/admin}" href="/admin" aria-label="Quản trị">
                    <span class="shop-action-text">Quản trị</span><span class="shop-admin-icon"
                                                                        aria-hidden="true">⚙</span>
                </a>
            </div>
        </div>
    </nav>
</header>
<div th:fragment="alerts" class="container mt-3">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>
<footer th:fragment="footer" class="site-footer">
    <div class="container"><span>© Ecommerce Shop</span></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
