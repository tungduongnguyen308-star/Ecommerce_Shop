<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <title>Biểu mẫu sản phẩm · Ecommerce Shop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/css/smartshop.css}" href="/css/smartshop.css" />
  <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}" href="/css/admin-dashboard.css" />
</head>
<body class="admin-body">
<div class="admin-shell">
  <input class="admin-sidebar-toggle" id="admin-sidebar-toggle" type="checkbox" aria-label="Mở menu quản trị" />
  <aside th:replace="~{admin/sidebar :: sidebar('products')}"></aside>
  <label for="admin-sidebar-toggle" class="admin-sidebar-backdrop" aria-hidden="true"></label>
  <div class="admin-workspace">
    <header class="admin-topbar">
      <div class="admin-topbar-left">
        <label for="admin-sidebar-toggle" class="admin-mobile-menu" aria-label="Mở điều hướng">☰</label>
        <div>
          <div class="admin-topbar-breadcrumb">Ecommerce Shop <span>/</span> Sản phẩm</div>
          <strong>Sản phẩm</strong>
        </div>
      </div>
      <a class="admin-topbar-shop" th:href="@{/}">↗ <span>Xem cửa hàng</span></a>
    </header>
    <main class="admin-page">
      <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<section class="admin-page-heading">
  <div><p class="admin-eyebrow">THÔNG TIN SẢN PHẨM</p>
    <h1 th:text="${editId == null} ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'">Thêm sản phẩm</h1>
    <p class="admin-muted mb-0">Nhập đầy đủ thông tin để lưu sản phẩm.</p></div>
  <a class="btn btn-outline-secondary" th:href="@{/admin/products}">← Danh sách sản phẩm</a>
</section>
<section class="admin-panel admin-product-form-panel">
  <form method="post" th:object="${productForm}"
        th:action="${editId == null} ? @{/admin/products} : @{/admin/products/{id}(id=${editId})}" novalidate>
    <div class="row g-3">
      <div class="col-md-7"><label class="form-label" for="productName">Tên sản phẩm *</label>
        <input id="productName" class="form-control" th:field="*{name}" required maxlength="200" />
        <div class="field-error" th:errors="*{name}"></div></div>
      <div class="col-md-5"><label class="form-label" for="productCategory">Danh mục *</label>
        <select id="productCategory" class="form-select" th:field="*{categoryId}" required>
          <option value="">Chọn danh mục</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
        </select><div class="field-error" th:errors="*{categoryId}"></div></div>
      <div class="col-12"><label class="form-label" for="productDescription">Mô tả *</label>
        <textarea id="productDescription" class="form-control" rows="4" th:field="*{description}" required maxlength="3000"></textarea>
        <div class="field-error" th:errors="*{description}"></div></div>
      <div class="col-md-6"><label class="form-label" for="productPrice">Giá bán (VND) *</label>
        <input id="productPrice" class="form-control" th:field="*{price}" type="number" min="0.01" step="0.01" required />
        <div class="field-error" th:errors="*{price}"></div></div>
      <div class="col-md-6"><label class="form-label" for="productStock">Tồn kho *</label>
        <input id="productStock" class="form-control" th:field="*{stock}" type="number" min="0" required />
        <div class="field-error" th:errors="*{stock}"></div></div>
      <div class="col-12"><label class="form-label" for="productImage">Đường dẫn hình ảnh *</label>
        <input id="productImage" class="form-control" th:field="*{imageUrl}" required />
        <div class="field-error" th:errors="*{imageUrl}"></div>
        <small class="text-muted">Ví dụ: /img/product_img/laptop.jpg</small></div>
      <div class="col-12"><div class="form-check"><input id="productActive" class="form-check-input" type="checkbox" th:field="*{active}" />
        <label class="form-check-label" for="productActive">Đang bán / hiển thị trên website</label></div></div>
    </div>
    <div class="admin-form-actions mt-4">
      <button class="btn btn-primary btn-lg" type="submit">Lưu sản phẩm</button>
      <a class="btn btn-outline-secondary btn-lg" th:href="@{/admin/products}">Hủy</a>
    </div>
  </form>
</section>
    </main>
    <div class="admin-page-footer">© Ecommerce Shop</div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
