<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Thanh toán')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><div th:replace="~{fragments :: alerts}"></div>
<main class="container section-pad"><div class="eyebrow text-primary">CHECKOUT</div><h1 class="mb-4">Thông tin đặt hàng</h1><div class="row g-4"><div class="col-lg-7"><div class="form-surface"><form th:action="@{/checkout}" th:object="${checkoutForm}" method="post" novalidate>
<div class="mb-3"><label class="form-label">Họ và tên *</label><input class="form-control" th:field="*{customerName}" required maxlength="150"><div class="field-error" th:errors="*{customerName}"></div></div>
<div class="row g-3"><div class="col-md-6"><label class="form-label">Email *</label><input type="email" class="form-control" th:field="*{email}" required><div class="field-error" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Số điện thoại *</label><input class="form-control" th:field="*{phone}" required><div class="field-error" th:errors="*{phone}"></div></div></div>
<div class="mt-3 mb-3"><label class="form-label">Địa chỉ giao hàng *</label><textarea class="form-control" rows="3" th:field="*{address}" required minlength="8"></textarea><div class="field-error" th:errors="*{address}"></div></div>
<div class="mb-4"><label class="form-label">Ghi chú</label><textarea class="form-control" th:field="*{note}" rows="2"></textarea><div class="field-error" th:errors="*{note}"></div></div>
<button type="submit" class="btn btn-accent btn-lg">Xác nhận đặt hàng →</button>
</form></div></div><div class="col-lg-5"><div class="summary-box"><h4>Đơn hàng của bạn</h4><div class="d-flex justify-content-between py-2 border-bottom" th:each="line : ${lines}"><span th:text="${line.product.name}+' × '+${line.quantity}"></span><strong th:text="${#numbers.formatDecimal(line.subtotal,0,'POINT',0,'COMMA')}+' ₫'"></strong></div><div class="d-flex justify-content-between mt-4"><strong>Tổng cộng</strong><strong class="price" th:text="${#numbers.formatDecimal(total,0,'POINT',0,'COMMA')}+' ₫'"></strong></div></div></div></div></main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
