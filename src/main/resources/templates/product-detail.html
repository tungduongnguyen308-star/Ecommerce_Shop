<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chi tiết sản phẩm')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><div th:replace="~{fragments :: alerts}"></div>
<main class="container section-pad"><a th:href="@{/products}" class="back-link">← Trở về danh sách</a><div class="row g-5 mt-2"><div class="col-lg-6"><div class="detail-image"><img th:src="${product.imageUrl}" th:alt="${product.name}"></div></div><div class="col-lg-6"><div class="eyebrow text-primary" th:text="${product.categoryName}"></div><h1 class="detail-title" th:text="${product.name}"></h1><div class="detail-price" th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')}+' ₫'"></div><p class="text-muted lh-lg" th:text="${product.description}"></p><div class="stock-indicator" th:text="'● Còn '+${product.stock}+' sản phẩm'">● Còn hàng</div><form class="mt-4 d-flex flex-wrap gap-3" th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><input class="form-control quantity-input" type="number" name="quantity" min="1" max="100" value="1" required><button class="btn btn-accent btn-lg" th:disabled="${product.stock == 0}">🛒 Thêm vào giỏ hàng</button></form></div></div></main>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
