spring.application.name=Ecommerce_Shop
server.port=${PORT:8080}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/smartshop_tx1?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=SERVER}
spring.datasource.username=${MYSQL_USER:smartshop}
spring.datasource.password=${MYSQL_PASSWORD:smartshop123}
spring.datasource.hikari.maximum-pool-size=8
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
server.error.include-message=never
# MySQL schema + seed data live in database/tx1_smartshop.sql. Docker init executes it only on a fresh volume.
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Qdrant is OPTIONAL for vector-based product lookup, NOT a chatbot or LLM.
# JDBC CRUD / checkout work normally when Qdrant is not running.
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.collection=${QDRANT_COLLECTION:smartshop_products_hash_v1}
qdrant.embedding-provider=hash
# DEMO ONLY: change these before any shared/public deployment.
demo.admin-email=${DEMO_ADMIN_EMAIL:admin@smartshop.local}
demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin@123}
